<!DOCTYPE html>
<html lang="es">
	<!-- Comentarios para el Profe -->
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="author" content="Thiao Real y Benjamin Gadea">
		<link rel="stylesheet" href="../Style.css">
		<link rel="icon" type="image/jpg" href="../IMG/formulario.jpg">
		<title>Formulario</title>
	</head>
	
	<body class="Formulario">
		<form action="https://formsubmit.co/mbenjamingadeaa@gmail.com method="POST" />
		  <!-- Campo de Nombre -->
		  <div>
			<label for="nombre">Nombre:</label>
			<input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre..." required>
		  </div>

		  <!-- Campo de Correo Electrónico -->
		  <div>
			<label for="email">Correo electrónico:</label>
			<input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
		  </div>

		  <!-- Campo de Mensaje -->
		  <div>
			<label for="mensaje">Mensaje:</label>
			<textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
		  </div>

		  <!-- Botón de Envío -->
		  <div>
			<button type="submit">Enviar</button>
		  </div>
		</form>
	</body>
</html>
